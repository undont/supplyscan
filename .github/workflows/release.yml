name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and release (e.g., v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

# commit message / PR title patterns that cut a release, by bump type (grep -iE)
env:
  MAJOR_PATTERN: '^breaking:|BREAKING CHANGE:'
  MINOR_PATTERN: '^(feat|add|update):'
  PATCH_PATTERN: '^fix:'

jobs:
  # skip patterns are honoured on pushes only, so a PR title can't skip required checks
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Check for skip patterns
        id: skip_check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && echo "$COMMIT_MSG" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions)\]'; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping CI due to commit message pattern"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    needs: check-skip
    if: |
      needs.check-skip.outputs.should_skip != 'true' &&
      github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race ./...

  lint:
    runs-on: ubuntu-latest
    needs: check-skip
    if: |
      needs.check-skip.outputs.should_skip != 'true' &&
      github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall

  # Require a CHANGELOG entry on PRs whose title triggers a release.
  # The heading rollover ([Unreleased] -> [vX.Y.Z]) is still done manually;
  # this only guards against shipping a release with an empty Unreleased section.
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Require changelog entry for release PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qiE "$MAJOR_PATTERN|$MINOR_PATTERN|$PATCH_PATTERN"; then
            echo "PR title does not trigger a release; no changelog entry required."
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found, but this PR triggers a release."
            exit 1
          fi

          # Body of the "## [Unreleased]" section: lines up to the next "## " heading.
          UNRELEASED=$(awk '
            /^## \[Unreleased\]/ { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md)

          if ! echo "$UNRELEASED" | grep -qE '^[[:space:]]*-[[:space:]]+\S'; then
            echo "::error::Release-triggering PR ('$PR_TITLE') adds no entry under '## [Unreleased]' in CHANGELOG.md. Add a bullet describing the change."
            exit 1
          fi

          echo "Found Unreleased changelog entries:"
          echo "$UNRELEASED" | grep -E '^[[:space:]]*-[[:space:]]+\S'

  # Resolves the tag to release and the ref to build it from. On main the tag is
  # computed from the commit message and created by the release job after the
  # binaries build; a pushed tag or a dispatch releases an existing tag
  version:
    runs-on: ubuntu-latest
    needs: [check-skip, test, lint]
    if: |
      always() &&
      needs.check-skip.outputs.should_skip != 'true' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.test.result == 'success' && needs.lint.result == 'success')
      )
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ]; then
            TAG="$INPUT_TAG"
            [ "$EVENT_NAME" = "workflow_dispatch" ] || TAG="$REF_NAME"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must match vX.Y.Z (got: $TAG)"
              exit 1
            fi
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG does not exist"
              exit 1
            fi
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "ref=refs/tags/$TAG" >> $GITHUB_OUTPUT
            echo "new_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$COMMIT_MSG" | grep -qiE "$MAJOR_PATTERN"; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qiE "$MINOR_PATTERN"; then
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -qiE "$PATCH_PATTERN"; then
            BUMP_TYPE="patch"
          else
            echo "No release-triggering commit type found"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Detected bump type: $BUMP_TYPE"

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          if git rev-parse "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "ref=$GITHUB_SHA" >> $GITHUB_OUTPUT
          echo "new_tag=true" >> $GITHUB_OUTPUT

  build-binaries:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          go build -ldflags="-s -w -X github.com/undont/supplyscan/internal/types.Version=${TAG#v}" -o supplyscan-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/supplyscan

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: supplyscan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: supplyscan-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    permissions:
      contents: write
    needs: [version, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: supplyscan-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NEW_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          # Source release notes from CHANGELOG.md: prefer the section matching
          # this version (e.g. "## [1.12.1]"), else the "## [Unreleased]" section.
          extract_section() {
            awk -v want="$1" '
              $0 ~ "^## \\[" want "\\]" { capture=1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }
          NOTES=$(extract_section "${TAG#v}")
          if ! echo "$NOTES" | grep -qE '^[[:space:]]*-[[:space:]]+\S'; then
            NOTES=$(extract_section "Unreleased")
          fi

          if echo "$NOTES" | grep -qE '^[[:space:]]*-[[:space:]]+\S'; then
            NOTES_ARG=(--notes "$NOTES")
          else
            echo "No curated changelog entries found; falling back to generated notes."
            NOTES_ARG=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # a computed tag with an existing release means another main run claimed it first
            if [ "$NEW_TAG" = "true" ]; then
              echo "::error::Release $TAG already exists; refusing to overwrite its binaries"
              exit 1
            fi
            echo "Release $TAG already exists, uploading assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" "${NOTES_ARG[@]}"
          fi

  update-homebrew:
    permissions:
      contents: read
    needs: [version, release]
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
